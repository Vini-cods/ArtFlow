<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desenhar - ArtFlow Kids</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="drawing.css" />
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon" />
</head>

<body>
  <!-- Conteúdo Principal -->
  <div class="main-content">
    <div class="drawing-container">
      <!-- Bolinhas flutuantes interativas - MOVIDA PARA O HEADER -->
      <div class="floating-shapes"></div>

      <div class="drawing-header">
        <button class="back-button" onclick="window.location.href='../index.html'">
          <i class="fas fa-arrow-left"></i> Voltar para Início
        </button>
        <h2 class="drawing-title">Exponha suas ideias</h2>
        <div class="drawing-info">Desenhe o que você quiser!</div>
      </div>

      <div class="drawing-area">
        <div class="tools-panel">
          <!-- Ferramentas básicas - REMOVIDOS BALDE E FORMAS -->
          <div class="tool-btn active" data-tool="pencil" data-tooltip="Lápis">
            <i class="fas fa-pencil-alt"></i>
          </div>
          <div class="tool-btn" data-tool="brush" data-tooltip="Pincel">
            <i class="fas fa-paint-brush"></i>
          </div>
          <div class="tool-btn" data-tool="marker" data-tooltip="Marcador">
            <i class="fas fa-highlighter"></i>
          </div>
          <div class="tool-btn" data-tool="spray" data-tooltip="Spray">
            <i class="fas fa-spray-can"></i>
          </div>
          <div class="tool-btn" data-tool="eraser" data-tooltip="Borracha">
            <i class="fas fa-eraser"></i>
          </div>

          <!-- Paleta de cores expandida -->
          <div class="color-palette">
            <div class="color-btn active" style="background-color: #000000" data-color="#000000"></div>
            <div class="color-btn" style="background-color: #ff0000" data-color="#ff0000"></div>
            <div class="color-btn" style="background-color: #0000ff" data-color="#0000ff"></div>
            <div class="color-btn" style="background-color: #00ff00" data-color="#00ff00"></div>
            <div class="color-btn" style="background-color: #ffff00" data-color="#ffff00"></div>
            <div class="color-btn" style="background-color: #ff00ff" data-color="#ff00ff"></div>
            <div class="color-btn" style="background-color: #ff8800" data-color="#ff8800"></div>
            <div class="color-btn" style="background-color: #00ffff" data-color="#00ffff"></div>
            <div class="color-btn" style="background-color: #8800ff" data-color="#8800ff"></div>
            <div class="color-btn" style="background-color: #ff0088" data-color="#ff0088"></div>
            <div class="color-btn" style="background-color: #8a5c2e" data-color="#8a5c2e"></div>
            <div class="color-btn" style="background-color: #ff9999" data-color="#ff9999"></div>
            <div class="color-btn" style="background-color: #99ff99" data-color="#99ff99"></div>
            <div class="color-btn" style="background-color: #9999ff" data-color="#9999ff"></div>
            <div class="color-btn" style="background-color: #ffff99" data-color="#ffff99"></div>
            <div class="color-btn" style="background-color: #ff99ff" data-color="#ff99ff"></div>
          </div>

          <div class="tool-btn" id="color-picker-btn" data-tooltip="Seletor de Cor">
            <i class="fas fa-palette"></i>
          </div>
          <input type="color" id="color-picker" style="display: none" />

          <!-- Opções de ferramentas -->
          <div class="tool-options">
            <div class="tool-option">
              <label for="brush-size">Tamanho:</label>
              <input type="range" id="brush-size" min="1" max="100" value="5" />
              <span id="brush-size-value">5px</span>
            </div>
            <div class="tool-option">
              <label for="opacity">Opacidade:</label>
              <input type="range" id="opacity" min="10" max="100" value="100" />
              <span id="opacity-value">100%</span>
            </div>
          </div>
        </div>
        <div class="canvas-container">
          <canvas id="drawing-canvas"></canvas>
        </div>
      </div>
      <div class="drawing-controls">
        <button class="control-btn undo" id="undo-action">
          <i class="fas fa-undo"></i> Desfazer
        </button>
        <button class="control-btn redo" id="redo-action">
          <i class="fas fa-redo"></i> Refazer
        </button>
        <button class="control-btn clear" id="clear-btn">
          <i class="fas fa-trash"></i> Limpar
        </button>
        <button class="control-btn save" id="save-btn">
          <i class="fas fa-save"></i> Salvar Desenho
        </button>
      </div>
    </div>
  </div>

  <div class="notification" id="notification">
    <div class="notification-content">
      <i class="fas fa-check-circle"></i>
      <span id="notification-text">Desenho salvo com sucesso!</span>
    </div>
  </div>

  <script src="drawing.js"></script>

  <script>
class ArduinoController {
    constructor() {
        this.port = null;
        this.reader = null;
        this.connected = false;
    }

    async connectArduino() {
        try {
            console.log("🔌 Iniciando conexão Arduino...");
            
            // Fechar qualquer conexão existente
            if (this.port) {
                await this.disconnectArduino();
            }

            // Solicitar porta ao usuário
            this.port = await navigator.serial.requestPort();
            console.log("📡 Porta selecionada:", this.port);

            // Configurar a porta
            await this.port.open({
                baudRate: 9600,
                dataBits: 8,
                stopBits: 1,
                parity: 'none',
                flowControl: 'none'
            });

            console.log("✅ Porta serial aberta");
            this.connected = true;
            
            // Pequeno delay para estabilização
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            this.showMessage("✅ Arduino conectado!", "success");
            this.startReading();

        } catch (error) {
            console.error("❌ Erro na conexão:", error);
            let errorMsg = "Erro ao conectar: ";
            
            if (error.name === 'NotFoundError') {
                errorMsg += "Nenhum dispositivo encontrado.";
            } else if (error.name === 'SecurityError') {
                errorMsg += "Permissão negada.";
            } else if (error.message.includes('open')) {
                errorMsg += "Porta já em uso. Feche o Arduino IDE e outros programas.";
            } else {
                errorMsg += error.message;
            }
            
            this.showMessage(errorMsg, "error");
        }
    }

    async startReading() {
        try {
            console.log("📖 Iniciando leitura...");
            
            while (this.port.readable && this.connected) {
                const textDecoder = new TextDecoder();
                this.reader = this.port.readable.getReader();
                let buffer = '';

                try {
                    while (true) {
                        const { value, done } = await this.reader.read();
                        
                        if (done) {
                            console.log("Leitor finalizado");
                            break;
                        }

                        if (value) {
                            buffer += textDecoder.decode(value);
                            const lines = buffer.split('\n');
                            buffer = lines.pop() || '';

                            for (const line of lines) {
                                const trimmed = line.trim();
                                if (trimmed) {
                                    console.log("📨 Dados recebidos:", trimmed);
                                    this.processData(trimmed);
                                }
                            }
                        }
                    }
                } catch (readError) {
                    console.error("Erro na leitura:", readError);
                } finally {
                    this.reader.releaseLock();
                }
            }
        } catch (error) {
            console.error("Erro no loop de leitura:", error);
        }
    }

    processData(data) {
        // Ignorar mensagem de conexão
        if (data === "ARDUINO_CONNECTED") {
            console.log("🔗 Arduino confirmou conexão");
            return;
        }

        const size = parseInt(data);
        if (!isNaN(size) && size >= 1 && size <= 100) {
            console.log("🎨 Atualizando pincel para:", size);
            this.updateBrushSize(size);
        }
    }

    updateBrushSize(size) {
        const slider = document.getElementById('brush-size');
        const valueSpan = document.getElementById('brush-size-value');
        
        if (slider && valueSpan) {
            slider.value = size;
            valueSpan.textContent = size + 'px';
            
            // Disparar evento para atualizar todas as ferramentas
            const inputEvent = new Event('input', { bubbles: true });
            slider.dispatchEvent(inputEvent);
        }
    }

    async disconnectArduino() {
        try {
            this.connected = false;
            
            if (this.reader) {
                await this.reader.cancel();
                this.reader = null;
            }
            
            if (this.port) {
                await this.port.close();
                this.port = null;
            }
            
            console.log("🔌 Arduino desconectado");
            this.showMessage("🔌 Arduino desconectado", "info");
            
        } catch (error) {
            console.error("Erro ao desconectar:", error);
        }
    }

    showMessage(message, type) {
        const notification = document.getElementById("notification");
        const text = document.getElementById("notification-text");
        const icon = notification.querySelector("i");
        
        if (notification && text) {
            text.textContent = message;
            
            if (type === "success") {
                notification.style.background = "linear-gradient(45deg, #4caf50, #8bc34a)";
                icon.className = "fas fa-check-circle";
            } else if (type === "error") {
                notification.style.background = "linear-gradient(45deg, #ff6b6b, #ff9e7d)";
                icon.className = "fas fa-exclamation-circle";
            } else {
                notification.style.background = "rgba(45, 21, 84, 0.9)";
                icon.className = "fas fa-info-circle";
            }
            
            notification.style.opacity = "1";
            notification.style.transform = "translateY(0)";
            
            setTimeout(() => {
                notification.style.opacity = "0";
                notification.style.transform = "translateY(20px)";
            }, 4000);
        }
    }
}

// Gerenciador global do Arduino
let arduino = null;

document.addEventListener('DOMContentLoaded', function() {
    console.log("🚀 Inicializando interface Arduino...");
    
    // Adicionar botão do Arduino
    const toolsPanel = document.querySelector('.tools-panel');
    
    if (toolsPanel && !document.querySelector('#arduino-btn')) {
        const arduinoButton = document.createElement('div');
        arduinoButton.id = 'arduino-btn';
        arduinoButton.className = 'tool-btn';
        arduinoButton.innerHTML = '<i class="fas fa-microchip"></i>';
        arduinoButton.setAttribute('data-tooltip', 'Conectar Arduino');
        
        arduinoButton.addEventListener('click', async function() {
            if (!arduino) {
                arduino = new ArduinoController();
            }
            
            if (!arduino.connected) {
                await arduino.connectArduino();
                if (arduino.connected) {
                    arduinoButton.classList.add('connected');
                    arduinoButton.innerHTML = '<i class="fas fa-plug"></i>';
                    arduinoButton.setAttribute('data-tooltip', 'Desconectar Arduino');
                }
            } else {
                await arduino.disconnectArduino();
                arduinoButton.classList.remove('connected');
                arduinoButton.innerHTML = '<i class="fas fa-microchip"></i>';
                arduinoButton.setAttribute('data-tooltip', 'Conectar Arduino');
            }
        });
        
        // Inserir na interface
        const toolOptions = toolsPanel.querySelector('.tool-options');
        if (toolOptions) {
            toolsPanel.insertBefore(arduinoButton, toolOptions);
        } else {
            toolsPanel.appendChild(arduinoButton);
        }
        
        console.log("🔘 Botão Arduino adicionado à interface");
    }
});
</script>
</body>

</html>
