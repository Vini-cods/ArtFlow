<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desenhar - ArtFlow Kids</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="drawing.css" />
  <link rel="icon" href="../img/favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon" />
</head>

<body>
  <!-- Conteúdo Principal -->
  <div class="main-content">
    <div class="drawing-container">
      <!-- Bolinhas flutuantes interativas - MOVIDA PARA O HEADER -->
      <div class="floating-shapes"></div>

      <div class="drawing-header">
        <button class="back-button" onclick="window.location.href='../index.html'">
          <i class="fas fa-arrow-left"></i> Voltar para Início
        </button>
        <h2 class="drawing-title">Exponha suas ideias</h2>
        <div class="drawing-info">Desenhe o que você quiser!</div>
      </div>

      <div class="drawing-area">
        <div class="tools-panel">
          <!-- Ferramentas básicas - REMOVIDOS BALDE E FORMAS -->
          <div class="tool-btn active" data-tool="pencil" data-tooltip="Lápis">
            <i class="fas fa-pencil-alt"></i>
          </div>
          <div class="tool-btn" data-tool="brush" data-tooltip="Pincel">
            <i class="fas fa-paint-brush"></i>
          </div>
          <div class="tool-btn" data-tool="marker" data-tooltip="Marcador">
            <i class="fas fa-highlighter"></i>
          </div>
          <div class="tool-btn" data-tool="spray" data-tooltip="Spray">
            <i class="fas fa-spray-can"></i>
          </div>
          <div class="tool-btn" data-tool="eraser" data-tooltip="Borracha">
            <i class="fas fa-eraser"></i>
          </div>

          <!-- Paleta de cores expandida -->
          <div class="color-palette">
            <div class="color-btn active" style="background-color: #000000" data-color="#000000"></div>
            <div class="color-btn" style="background-color: #ff0000" data-color="#ff0000"></div>
            <div class="color-btn" style="background-color: #0000ff" data-color="#0000ff"></div>
            <div class="color-btn" style="background-color: #00ff00" data-color="#00ff00"></div>
            <div class="color-btn" style="background-color: #ffff00" data-color="#ffff00"></div>
            <div class="color-btn" style="background-color: #ff00ff" data-color="#ff00ff"></div>
            <div class="color-btn" style="background-color: #ff8800" data-color="#ff8800"></div>
            <div class="color-btn" style="background-color: #00ffff" data-color="#00ffff"></div>
            <div class="color-btn" style="background-color: #8800ff" data-color="#8800ff"></div>
            <div class="color-btn" style="background-color: #ff0088" data-color="#ff0088"></div>
            <div class="color-btn" style="background-color: #8a5c2e" data-color="#8a5c2e"></div>
            <div class="color-btn" style="background-color: #ff9999" data-color="#ff9999"></div>
            <div class="color-btn" style="background-color: #99ff99" data-color="#99ff99"></div>
            <div class="color-btn" style="background-color: #9999ff" data-color="#9999ff"></div>
            <div class="color-btn" style="background-color: #ffff99" data-color="#ffff99"></div>
            <div class="color-btn" style="background-color: #ff99ff" data-color="#ff99ff"></div>
          </div>

          <div class="tool-btn" id="color-picker-btn" data-tooltip="Seletor de Cor">
            <i class="fas fa-palette"></i>
          </div>
          <input type="color" id="color-picker" style="display: none" />

          <!-- Opções de ferramentas -->
          <div class="tool-options">
            <div class="tool-option">
              <label for="brush-size">Tamanho:</label>
              <input type="range" id="brush-size" min="1" max="100" value="5" />
              <span id="brush-size-value">5px</span>
            </div>
            <div class="tool-option">
              <label for="opacity">Opacidade:</label>
              <input type="range" id="opacity" min="10" max="100" value="100" />
              <span id="opacity-value">100%</span>
            </div>
          </div>
        </div>
        <div class="canvas-container">
          <canvas id="drawing-canvas"></canvas>
        </div>
      </div>
      <div class="drawing-controls">
        <button class="control-btn undo" id="undo-action">
          <i class="fas fa-undo"></i> Desfazer
        </button>
        <button class="control-btn redo" id="redo-action">
          <i class="fas fa-redo"></i> Refazer
        </button>
        <button class="control-btn clear" id="clear-btn">
          <i class="fas fa-trash"></i> Limpar
        </button>
        <button class="control-btn save" id="save-btn">
          <i class="fas fa-save"></i> Salvar Desenho
        </button>
      </div>
    </div>
  </div>

  <div class="notification" id="notification">
    <div class="notification-content">
      <i class="fas fa-check-circle"></i>
      <span id="notification-text">Desenho salvo com sucesso!</span>
    </div>
  </div>

  <script src="drawing.js"></script>

  <script>
    // Web Serial API para comunicação com Arduino
    class ArduinoPotentiometer {
      constructor() {
        this.port = null;
        this.reader = null;
        this.isConnected = false;
        this.connectButton = null;
      }

      async connect() {
        try {
          // Solicita acesso à porta serial
          this.port = await navigator.serial.requestPort();
          await this.port.open({ baudRate: 9600 });

          this.isConnected = true;
          this.listenToData();
          this.showStatus('Conectado ao Arduino!', 'success');

        } catch (error) {
          console.error('Erro ao conectar:', error);
          this.showStatus('Erro ao conectar: ' + error.message, 'error');
        }
      }

      async listenToData() {
        while (this.port.readable) {
          this.reader = this.port.readable.getReader();

          try {
            while (true) {
              const { value, done } = await this.reader.read();
              if (done) break;

              // Converte os bytes recebidos para string
              const text = new TextDecoder().decode(value);
              const lines = text.split('\n');

              lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed && !isNaN(trimmed)) {
                  const brushSize = parseInt(trimmed);
                  this.handleBrushSizeChange(brushSize);
                }
              });
            }
          } catch (error) {
            console.error('Erro na leitura:', error);
          } finally {
            this.reader.releaseLock();
          }
        }
      }

      handleBrushSizeChange(size) {
        // Atualiza o slider e o valor da grossura
        const brushSizeSlider = document.getElementById('brush-size');
        const brushSizeValue = document.getElementById('brush-size-value');

        if (brushSizeSlider && brushSizeValue) {
          brushSizeSlider.value = size;
          brushSizeValue.textContent = size + 'px';

          // Dispara o evento de input para atualizar o canvas
          brushSizeSlider.dispatchEvent(new Event('input'));
        }
      }

      showStatus(message, type) {
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notification-text');
        const notificationIcon = notification.querySelector('i');

        notificationText.textContent = message;
        notificationIcon.className = type === 'success' ?
          'fas fa-check-circle' : 'fas fa-exclamation-circle';

        notification.style.opacity = '1';
        notification.style.transform = 'translateY(0)';

        setTimeout(() => {
          notification.style.opacity = '0';
          notification.style.transform = 'translateY(20px)';
        }, 3000);
      }

      async disconnect() {
        if (this.reader) {
          await this.reader.cancel();
        }
        if (this.port) {
          await this.port.close();
        }
        this.isConnected = false;
        this.showStatus('Desconectado do Arduino', 'info');
      }
    }

    // Inicializa quando o DOM estiver carregado
    document.addEventListener('DOMContentLoaded', function () {
      const arduino = new ArduinoPotentiometer();

      // Adiciona botão de conexão ao painel de ferramentas
      const toolsPanel = document.querySelector('.tools-panel');
      const connectButton = document.createElement('div');
      connectButton.className = 'tool-btn';
      connectButton.innerHTML = '<i class="fas fa-microchip"></i>';
      connectButton.setAttribute('data-tooltip', 'Conectar Arduino');
      connectButton.style.marginTop = '10px';

      connectButton.addEventListener('click', function () {
        if (!arduino.isConnected) {
          arduino.connect();
        } else {
          arduino.disconnect();
        }
      });

      toolsPanel.appendChild(connectButton);
    });
  </script>

</body>

</html>
