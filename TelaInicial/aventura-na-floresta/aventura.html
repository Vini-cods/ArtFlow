<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aventura na Floresta - ArtFlow Kids</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="aventura.css" />
    <link rel="icon" href="../img/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <!-- Bolinhas flutuantes de fundo -->
    <div class="floating-shapes"></div>

    <!-- Conteúdo principal -->
    <div class="drawing-container">
      <div class="header">
        <div class="action-buttons">
          <button class="btn btn-back" onclick="goBack()">
            <i class="fas fa-arrow-left"></i> Voltar
          </button>
        </div>
        <div class="story-info">
          <h1 class="story-title" id="story-title">Aventura na Floresta</h1>
          <p class="story-author" id="story-author">Por: Sofia Mendes</p>
        </div>
        <div class="action-buttons">
          <button class="btn btn-undo" onclick="undoDrawing()" id="undo-action">
            <i class="fas fa-undo"></i> Desfazer
          </button>
          <button class="btn btn-redo" onclick="redoDrawing()" id="redo-action">
            <i class="fas fa-redo"></i> Refazer
          </button>
          <button class="btn btn-clear" onclick="clearCanvas()">
            <i class="fas fa-eraser"></i> Limpar
          </button>
          <button class="btn btn-save" onclick="saveDrawing()">
            <i class="fas fa-save"></i> Salvar
          </button>
        </div>
      </div>

      <div class="content-area">
        <div class="book-section">
          <div class="book-content" id="book-content">
            <!-- Conteúdo será carregado dinamicamente pelo JavaScript -->
          </div>
          <div class="page-controls">
            <button class="page-btn" id="prev-page" onclick="previousPage()">
              <i class="fas fa-chevron-left"></i>
            </button>
            <span class="page-indicator" id="page-indicator"
              >Página 1 de 7</span
            >
            <button class="page-btn" id="next-page" onclick="nextPage()">
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>
        </div>

        <div class="drawing-section">
          <div class="drawing-area">
            <canvas id="drawing-canvas"></canvas>
          </div>
          <div class="tools-area">
            <div class="drawing-tools">
              <div class="tool-buttons">
                <button
                  class="tool-btn active"
                  data-tool="pencil"
                  title="Lápis"
                >
                  <i class="fas fa-pencil-alt"></i>
                </button>
                <button class="tool-btn" data-tool="brush" title="Pincel">
                  <i class="fas fa-paint-brush"></i>
                </button>
                <button class="tool-btn" data-tool="marker" title="Marcador">
                  <i class="fas fa-highlighter"></i>
                </button>
                <button class="tool-btn" data-tool="spray" title="Spray">
                  <i class="fas fa-spray-can"></i>
                </button>
                <button class="tool-btn" data-tool="eraser" title="Borracha">
                  <i class="fas fa-eraser"></i>
                </button>
              </div>
            </div>

            <div class="color-palette">
              <div
                class="color-option active"
                style="background-color: #000000"
                data-color="#000000"
              ></div>
              <div
                class="color-option"
                style="background-color: #ff0000"
                data-color="#ff0000"
              ></div>
              <div
                class="color-option"
                style="background-color: #0000ff"
                data-color="#0000ff"
              ></div>
              <div
                class="color-option"
                style="background-color: #00ff00"
                data-color="#00ff00"
              ></div>
              <div
                class="color-option"
                style="background-color: #ffff00"
                data-color="#ffff00"
              ></div>
              <div
                class="color-option"
                style="background-color: #ff00ff"
                data-color="#ff00ff"
              ></div>
              <div
                class="color-option"
                style="background-color: #ff8800"
                data-color="#ff8800"
              ></div>
              <div
                class="color-option"
                style="background-color: #00ffff"
                data-color="#00ffff"
              ></div>
              <div
                class="color-option"
                style="background-color: #8800ff"
                data-color="#8800ff"
              ></div>
              <div
                class="color-option"
                style="background-color: #ff0088"
                data-color="#ff0088"
              ></div>
              <div
                class="color-option"
                style="background-color: #8a5c2e"
                data-color="#8a5c2e"
              ></div>
              <div
                class="color-option"
                style="background-color: #ff9999"
                data-color="#ff9999"
              ></div>
              <div
                class="color-option"
                style="background-color: #99ff99"
                data-color="#99ff99"
              ></div>
              <div
                class="color-option"
                style="background-color: #9999ff"
                data-color="#9999ff"
              ></div>
              <div
                class="color-option"
                style="background-color: #ffff99"
                data-color="#ffff99"
              ></div>
              <div
                class="color-option"
                style="background-color: #ff99ff"
                data-color="#ff99ff"
              ></div>
            </div>

            <div class="tool-controls">
              <div class="brush-size">
                <label for="brush-size">Espessura:</label>
                <input
                  type="range"
                  id="brush-size"
                  min="1"
                  max="100"
                  value="5"
                />
                <span id="brush-size-value">5px</span>
              </div>

              <div class="opacity-control">
                <label for="opacity">Opacidade:</label>
                <input
                  type="range"
                  id="opacity"
                  min="10"
                  max="100"
                  value="100"
                />
                <span id="opacity-value">100%</span>
              </div>

              <div class="custom-color">
                <label for="color-picker">Cor personalizada:</label>
                <input type="color" id="color-picker" value="#000000" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="notification" id="notification">
      <div class="notification-content">
        <i class="fas fa-check-circle"></i>
        <span id="notification-text">Desenho salvo com sucesso!</span>
      </div>
    </div>

    <script src="aventura.js"></script>
  </body>
</html>
